spring.application.name=aquasense-soa

spring.datasource.url=jdbc:mysql://localhost:3306/aquasense?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}

# O esquema é criado pelas migrações do Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# Senha local (arquivo ignorado pelo Git). Se existir, sobrescreve a senha acima.
spring.config.import=optional:classpath:application-local.properties
